services:
- type: web
name: ius-brain-shift
env: python
buildCommand: pip install -r requirements.txt
startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
envVars:
- key: MODEL_PATH
value: models/brain_shift_model_fulldataset.pt
- key: WORK_DIR
value: /tmp/ius_runs
- key: PYTHONUNBUFFERED
value: "1"
autoDeploy: true
plan: starter # upgrade if you need more RAM/CPU