services:
  - type: web
    name: brain-shift-api
    runtime: python
    plan: starter
    autoDeploy: true
    envVars:
      - key: MODEL_PATH
        value: models/brain_shift_model_02.pt
      - key: DEVICE
        value: cuda
      - key: ALLOWED_ORIGINS
        value: '["https://www.babels.ai","https://babels.ai","http://localhost:3000"]'
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: cache
      mountPath: /var/cache
      sizeGB: 1
